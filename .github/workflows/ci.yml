name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: node --version
        run: node --version

      # The core system has zero runtime npm dependencies, so there is nothing to
      # install before running the gates.
      - name: test
        run: npm test

      - name: syntax check
        run: npm run check

      - name: leak gate
        run: npm run leak-scan

  dashboard:
    name: dashboard bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm --prefix <dir> ci` crashed with npm's internal "Exit handler never called!"
      # on the runner, so the frontend install runs in its own directory instead, which is
      # the documented way to drive a sub-package.
      - name: build the console
        working-directory: dashboard/app
        run: npm ci --no-audit --no-fund
      - name: build the bundle
        run: npm run dashboard:build

      # dashboard/static/ is committed on purpose so the console runs with no build step.
      # Rebuilding must therefore reproduce exactly what is checked in.
      - name: verify the committed bundle is up to date
        run: |
          if [ -n "$(git status --porcelain dashboard/static)" ]; then
            echo "::error::dashboard/static is stale. Run 'npm run dashboard:build' and commit the result."
            git status --porcelain dashboard/static
            git --no-pager diff --stat dashboard/static
            exit 1
          fi
          echo "dashboard/static is up to date"

  privacy:
    name: privacy gates (secret terms, packaged artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A maintainer's private identifiers must never be a file in the repository. When the
      # optional repository secret is set it is staged outside the checkout for this run,
      # and the value itself is never printed - only whether one was found.
      - name: stage the private term list when one is configured
        env:
          MEMKEEL_LEAK_TERMS: ${{ secrets.MEMKEEL_LEAK_TERMS }}
        run: |
          if [ -n "$MEMKEEL_LEAK_TERMS" ]; then
            printf '%s' "$MEMKEEL_LEAK_TERMS" > "$RUNNER_TEMP/private-terms.json"
            echo "MEMKEEL_LEAK_TERMS_FILE=$RUNNER_TEMP/private-terms.json" >> "$GITHUB_ENV"
            echo "private term list: configured"
          else
            echo "private term list: not configured - generic rules only"
          fi

      - name: leak gate (source tree)
        run: npm run leak-scan

      # A clean working tree says nothing about the tarball. This packs, unpacks, checks the
      # shipped file list against package.json "files" and scans the artifact's text.
      - name: leak gate (packaged artifact)
        run: npm run pack-scan

  docker:
    name: docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is built from the Dockerfile and run against synthetic data in $RUNNER_TEMP. There is
      # no registry, no push and no secret here: nothing leaves the runner, and the real knowledge base
      # and host configuration are never mounted into the container.
      - name: build the image
        run: docker build --tag memkeel:ci .

      - name: run it against synthetic data
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/memkeel-smoke"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/store" "$work/project"
          # The only data in play: a note the event cites and the event itself.
          printf '# Evidence\n\nA note the event can cite.\n' > "$work/store/evidence.md"

          # MEMKEEL_HOME is /memkeel in the image, so the mounts are the only paths involved.
          run() { docker run --rm -v "$work/home:/memkeel" -v "$work/store:/store" -v "$work/project:/project" memkeel:ci "$@"; }

          docker image inspect --format 'image id={{.Id}} size={{.Size}}' memkeel:ci

          run init --store /store
          run doctor
          workspace="$(run workspace-add --cwd /project | sed -n 's/.*"id": *"\([^"]*\)".*/\1/p')"
          test -n "$workspace" || { echo "::error::the workspace id could not be read back"; exit 1; }
          run register --topic "$workspace/smoke" --workspace "$workspace" --title "Container smoke"

          cat > "$work/project/event.json" <<EVENT
          {
            "event_id": "20260918-dsh-container-smoke-01",
            "workspace": "$workspace",
            "topic": "$workspace/smoke",
            "agent": "dsh",
            "occurred_at": "2026-09-18T00:00:00.000Z",
            "evidence": ["evidence.md"],
            "facts": [{ "key": "container-smoke", "text": "the image records and recalls a fact" }],
            "verification": ["recorded by the CI container smoke"]
          }
          EVENT

          run record --file /project/event.json
          run recall --query "container smoke" --workspace "$workspace" | grep -q 'container-smoke\|records and recalls'
          run doctor

          # Both mounts were written through: the journal note and the home's derived state exist on the
          # host side, which is what proves the image is not writing inside itself.
          test -n "$(find "$work/store/events" -name '*.md' -print -quit)"
          test -f "$work/home/config.json"
          echo "container smoke: ok"
