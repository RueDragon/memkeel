name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: node --version
        run: node --version

      # The core system has zero runtime npm dependencies, so there is nothing to
      # install before running the gates.
      - name: test
        run: npm test

      - name: syntax check
        run: npm run check

      - name: leak gate
        run: npm run leak-scan

  dashboard:
    name: dashboard bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm --prefix <dir> ci` crashed with npm's internal "Exit handler never called!"
      # on the runner, so the frontend install runs in its own directory instead, which is
      # the documented way to drive a sub-package.
      - name: build the console
        working-directory: dashboard/app
        run: npm ci --no-audit --no-fund
      - name: build the bundle
        run: npm run dashboard:build

      # dashboard/static/ is committed on purpose so the console runs with no build step.
      # Rebuilding must therefore reproduce exactly what is checked in.
      - name: verify the committed bundle is up to date
        run: |
          if [ -n "$(git status --porcelain dashboard/static)" ]; then
            echo "::error::dashboard/static is stale. Run 'npm run dashboard:build' and commit the result."
            git status --porcelain dashboard/static
            git --no-pager diff --stat dashboard/static
            exit 1
          fi
          echo "dashboard/static is up to date"

  privacy:
    name: privacy gates (secret terms, packaged artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A maintainer's private identifiers must never be a file in the repository. When the
      # optional repository secret is set it is staged outside the checkout for this run,
      # and the value itself is never printed - only whether one was found.
      - name: stage the private term list when one is configured
        env:
          MEMKEEL_LEAK_TERMS: ${{ secrets.MEMKEEL_LEAK_TERMS }}
        run: |
          if [ -n "$MEMKEEL_LEAK_TERMS" ]; then
            printf '%s' "$MEMKEEL_LEAK_TERMS" > "$RUNNER_TEMP/private-terms.json"
            echo "MEMKEEL_LEAK_TERMS_FILE=$RUNNER_TEMP/private-terms.json" >> "$GITHUB_ENV"
            echo "private term list: configured"
          else
            echo "private term list: not configured - generic rules only"
          fi

      - name: leak gate (source tree)
        run: npm run leak-scan

      # A clean working tree says nothing about the tarball. This packs, unpacks, checks the
      # shipped file list against package.json "files" and scans the artifact's text.
      - name: leak gate (packaged artifact)
        run: npm run pack-scan

  docker:
    name: docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is built from the Dockerfile and run against synthetic data in $RUNNER_TEMP. There is
      # no registry, no push and no secret here: nothing leaves the runner, and the real knowledge base
      # and host configuration are never mounted into the container.
      #
      # The smoke runs the commands the Dockerfile and the README document, as the invoking user rather
      # than as root, and checks what it leaves on the host. The image ships `git` so that workspace
      # identity can actually be derived, which is what `workspace-add --cwd` and `bootstrap --cwd` need:
      # an earlier revision of this job seeded the route and the topic by writing config.json through
      # `--entrypoint node` and said in a comment that the documented commands could not work here.
      - name: build the image
        run: docker build --tag memkeel:ci .

      - name: run it against synthetic data as the invoking user
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/memkeel-smoke"
          rm -rf "$work"
          mkdir -p "$work/memory-home" "$work/store" "$work/project"

          # A real repository: workspace identity is derived from the repository's common directory, not
          # from a directory name, so this is the input the documented command takes.
          git -C "$work/project" init --quiet

          printf '# Container smoke\n\nA note the recorded event can cite.\n' > "$work/store/evidence.md"

          # `--user "$(id -u):$(id -g)"` is the documented contract. Nothing below chowns a volume: the
          # container writes as the runner because these bind-mounted directories already belong to it.
          run() {
            docker run --rm --user "$(id -u):$(id -g)" \
              -v "$work/memory-home:/memkeel" -v "$work/store:/store" -v "$work/project:/project" \
              memkeel:ci "$@"
          }

          docker image inspect --format 'image id={{.Id}} size={{.Size}}' memkeel:ci
          # The prerequisite the git-dependent commands in the documentation rely on.
          docker run --rm --entrypoint git memkeel:ci --version

          run init --store /store

          # The workspace id is derived from the project root and a path hash, so it is read back from the
          # command's own output instead of being guessed or hard-coded - by the user or by this file.
          run workspace-add --cwd /project | tee "$work/workspace.json"
          workspace="$(sed -n 's/.*"id": "\([^"]*\)".*/\1/p' "$work/workspace.json" | head -n 1)"
          test -n "$workspace"
          echo "derived workspace id: $workspace"
          run register --topic "$workspace/ci" --workspace "$workspace" --title "Container smoke"

          cat > "$work/store/event.json" <<EVENT
          {
            "event_id": "20260918-dsh-container-smoke-01",
            "workspace": "$workspace",
            "topic": "$workspace/ci",
            "agent": "dsh",
            "occurred_at": "2026-09-18T00:00:00.000Z",
            "evidence": ["evidence.md"],
            "facts": [{ "key": "container-smoke", "text": "the image records and recalls a fact" }],
            "verification": ["recorded by the CI container smoke"]
          }
          EVENT

          run doctor
          run record --file /store/event.json
          run recall --query "container smoke" --workspace "$workspace" | grep -q 'container-smoke\|records and recalls'
          # The documented `bootstrap --cwd` example: it reads the project directory, and the workspace it
          # discovers has to be the one the event was recorded against.
          run bootstrap --cwd /project --query "container smoke" | grep -q "$workspace"
          run index --force
          run doctor

          # Both mounts were written through, so the journal note and the home's derived state exist on
          # the host side - which is what proves the image is not writing inside itself. Everything it
          # wrote belongs to the invoking user: that is the non-root contract, checked rather than
          # described, and it is the property a root container fails.
          test -n "$(find "$work/store/events" -name '*.md' -print -quit)"
          test -f "$work/memory-home/config.json"
          test -f "$work/memory-home/state/index.json"
          stray="$(find "$work/store" "$work/memory-home" ! -user "$(id -u)" -print -quit)"
          test -z "$stray" || { echo "not owned by uid $(id -u): $stray"; exit 1; }
          echo "container smoke: ok as uid $(id -u)"
